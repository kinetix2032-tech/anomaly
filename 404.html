<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 / SIGNAL LOST — ANOMALY</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #08090B;
      color: #E5E5E5;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    nav {
      width: 100%;
      height: 70px;
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #222;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .nav-logo img {
      display: block;
      width: 105px;
      height: auto;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-links a {
      color: #E5E5E5;
      text-decoration: none;
      font-size: 10px;
      letter-spacing: 2px;
      transition: 0.2s ease;
    }

    .nav-links a:hover {
      color: #777;
    }

    .menu-toggle {
      display: none;
      background: transparent;
      border: none;
      width: 30px;
      height: 24px;
      padding: 0;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      z-index: 1001;
    }

    .menu-toggle span {
      display: block;
      width: 30px;
      height: 2px;
      background: #E5E5E5;
    }

    .mobile-menu {
      display: none;
    }

    .error-page {
      min-height: calc(100vh - 70px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 40px;
    }

    .error-content {
      width: 100%;
      max-width: 1100px;
      text-align: center;
    }

    .error-code {
      font-size: clamp(90px, 18vw, 240px);
      line-height: 0.8;
      letter-spacing: -8px;
      font-weight: 700;
      color: #E5E5E5;
      margin-bottom: 50px;
    }

    .error-label {
      font-size: 10px;
      letter-spacing: 5px;
      color: #777;
      margin-bottom: 22px;
    }

    .error-title {
      font-size: clamp(28px, 5vw, 52px);
      line-height: 1;
      letter-spacing: 2px;
      margin-bottom: 25px;
    }

    .error-description {
      max-width: 520px;
      margin: 0 auto 45px;
      font-size: 11px;
      line-height: 2;
      letter-spacing: 2px;
      color: #888;
    }

    .return-button {
      display: inline-block;
      padding: 16px 26px;
      border: 1px solid #444;
      color: #E5E5E5;
      text-decoration: none;
      font-size: 10px;
      letter-spacing: 3px;
      transition: 0.25s ease;
    }

    .return-button:hover {
      background: #E5E5E5;
      color: #08090B;
      border-color: #E5E5E5;
    }

    .status-line {
      margin-top: 90px;
      padding-top: 20px;
      border-top: 1px solid #222;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      font-size: 9px;
      letter-spacing: 3px;
      color: #555;
    }

    @media (max-width: 700px) {

      nav {
        height: 70px;
        padding: 0 20px;
      }

      .nav-logo img {
        width: 82px;
      }

      .nav-links {
        display: none !important;
      }

      .menu-toggle {
        display: flex !important;
      }

      .mobile-menu {
        display: flex;
        position: fixed;
        top: 70px;
        left: 0;
        width: 100%;
        background: #08090B;
        border-bottom: 1px solid #222;
        padding: 30px 20px;
        flex-direction: column;
        gap: 28px;
        transform: translateY(-120%);
        transition: transform 0.35s ease;
        z-index: 999;
      }

      .mobile-menu.active {
        transform: translateY(0);
      }

      .mobile-menu a {
        color: #E5E5E5;
        text-decoration: none;
        font-size: 11px;
        letter-spacing: 4px;
        padding: 10px 0;
        border-bottom: 1px solid #222;
      }

      .error-page {
        min-height: calc(100vh - 70px);
        padding: 60px 20px;
      }

      .error-code {
        font-size: clamp(90px, 28vw, 150px);
        letter-spacing: -4px;
        margin-bottom: 40px;
      }

      .error-title {
        font-size: clamp(26px, 8vw, 38px);
        letter-spacing: 1px;
      }

      .error-description {
        max-width: 340px;
        font-size: 10px;
        line-height: 1.9;
        letter-spacing: 1.5px;
        margin-bottom: 35px;
      }

      .status-line {
        margin-top: 65px;
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <nav>

    <a href="index.html" class="nav-logo">
      <img src="text.png" alt="ANOMALY">
    </a>

    <div class="nav-links">
      <a href="index.html#shop">SHOP</a>
      <a href="about.html">ABOUT</a>
      <a href="contact.html">CONTACT</a>
    </div>

    <button class="menu-toggle" aria-label="Open navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>

  </nav>

  <div class="mobile-menu">
    <a href="index.html#shop">SHOP</a>
    <a href="about.html">ABOUT</a>
    <a href="contact.html">CONTACT</a>
  </div>


  <main class="error-page">

    <div class="error-content">

      <div class="error-code">404</div>

      <div class="error-label">SYSTEM RESPONSE</div>

      <h1 class="error-title">SIGNAL LOST.</h1>

      <p class="error-description">
        THE REQUESTED LOCATION DOES NOT EXIST.<br>
        NO VALID DESTINATION DETECTED.
      </p>

      <a href="index.html" class="return-button">
        RETURN TO ANOMALY
      </a>

      <div class="status-line">
        <span>STATUS: DISCONNECTED</span>
        <span>SIGNAL: NOT FOUND</span>
      </div>

    </div>

  </main>


  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const mobileMenu = document.querySelector('.mobile-menu');

    menuToggle.addEventListener('click', () => {
      mobileMenu.classList.toggle('active');
    });

    const mobileLinks = document.querySelectorAll('.mobile-menu a');

    mobileLinks.forEach(link => {
      link.addEventListener('click', () => {
        mobileMenu.classList.remove('active');
      });
    });
  </script>

</body>
</html>
